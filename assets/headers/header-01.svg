<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 125" width="100%" height="125" fill="none">
  <defs>
    <!-- Dynamic Accent Gradient -->
    <linearGradient id="hGrad_header_01" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="hBg_header_01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="60%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeBg_header_01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="hGlow_header_01" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .topic-tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 11.5px; letter-spacing: 1.5px; fill: #f59e0b; }
    .topic-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 27px; fill: #ffffff; letter-spacing: -0.4px; }
    .topic-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 13.5px; fill: #94a3b8; }
    .topic-num { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 13px; fill: #f59e0b; letter-spacing: 0.5px; }
  </style>

  <!-- Container Base with High-Contrast Dark Slate Background -->
  <rect x="2" y="2" width="916" height="121" rx="16" fill="url(#hBg_header_01)" stroke="#1e293b" stroke-width="2" />

  <!-- Glowing Left Vertical Accent Bar -->
  <rect x="2" y="14" width="6" height="97" rx="3" fill="url(#hGrad_header_01)" filter="url(#hGlow_header_01)" />

  <!-- Left Icon & Number Square Badge -->
  <g transform="translate(24, 23)">
    <rect width="78" height="78" rx="16" fill="url(#badgeBg_header_01)" stroke="url(#hGrad_header_01)" stroke-width="1.8" />
    <!-- Emoji Icon -->
    <text x="39" y="44" text-anchor="middle" font-size="30">🌟</text>
    <!-- Step Number / Tag Pill -->
    <rect x="14" y="54" width="50" height="18" rx="9" fill="#0f172a" stroke="url(#hGrad_header_01)" stroke-width="1.2" />
    <text x="39" y="67" text-anchor="middle" class="topic-num">01</text>
  </g>

  <!-- Content Stack (Middle to Right) -->
  <g transform="translate(118, 20)">
    <!-- Small Category Pill / Tagline -->
    <text x="0" y="20" class="topic-tag">SECTION 01 • PRINCIPLES</text>

    <!-- Prominent Big Bold Title -->
    <text x="0" y="54" class="topic-title">Golden Rules</text>

    <!-- Crystal Clear Subtitle -->
    <text x="0" y="80" class="topic-sub">5 Non-Negotiable Mental Principles Before Touching Code</text>
  </g>

  <!-- Right Decorative Gradient Nodes -->
  <g transform="translate(885, 62)">
    <circle cx="0" cy="0" r="16" fill="url(#badgeBg_header_01)" stroke="url(#hGrad_header_01)" stroke-width="1.2" />
    <circle cx="0" cy="0" r="4.5" fill="#f59e0b" />
  </g>
</svg>
