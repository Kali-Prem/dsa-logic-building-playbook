<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 125" width="100%" height="125" fill="none">
  <defs>
    <!-- Dynamic Accent Gradient -->
    <linearGradient id="hGrad_header_12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="hBg_header_12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="60%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- PREMIUM RED BADGE BACKGROUND -->
    <linearGradient id="redBadgeBg_header_12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.24" />
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.05" />
    </linearGradient>

    <!-- RADIANT RED BORDER GRADIENT -->
    <linearGradient id="redBorder_header_12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- BEST RED NUMBER TEXT GRADIENT -->
    <linearGradient id="redNumGrad_header_12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- RED GLOW FILTER -->
    <filter id="redGlow_header_12" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Left Accent Bar Soft Glow Filter -->
    <filter id="hGlow_header_12" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .topic-tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 11.5px; letter-spacing: 1.5px; fill: #059669; }
    .topic-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 27px; fill: #ffffff; letter-spacing: -0.4px; }
    .topic-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 13.5px; fill: #94a3b8; }
    .topic-num-2digit { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 42px; fill: url(#redNumGrad_header_12); letter-spacing: -1px; }
    .topic-num-word { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 20px; fill: url(#redNumGrad_header_12); letter-spacing: 1px; }
  </style>

  <!-- Container Base with High-Contrast Dark Slate Background -->
  <rect x="2" y="2" width="916" height="121" rx="16" fill="url(#hBg_header_12)" stroke="#1e293b" stroke-width="2" />

  <!-- Glowing Left Vertical Accent Bar -->
  <rect x="2" y="14" width="6" height="97" rx="3" fill="url(#hGrad_header_12)" filter="url(#hGlow_header_12)" />

  <!-- Left Full Box Red Number Badge -->
  <g transform="translate(24, 23)">
    <!-- Ambient Glow Shadow Box -->
    <rect width="80" height="78" rx="16" fill="url(#redBadgeBg_header_12)" stroke="url(#redBorder_header_12)" stroke-width="2" filter="url(#redGlow_header_12)" opacity="0.6" />
    <!-- Sharp Front Box -->
    <rect width="80" height="78" rx="16" fill="url(#redBadgeBg_header_12)" stroke="url(#redBorder_header_12)" stroke-width="2" />
    
    <!-- Red Glow Layer for Text -->
    <text x="40" y="54" text-anchor="middle" class="topic-num-2digit" fill="#ff1744" filter="url(#redGlow_header_12)" opacity="0.7">12</text>
    <!-- Sharp Bold Red Number Filling the Full Box -->
    <text x="40" y="54" text-anchor="middle" class="topic-num-2digit">12</text>
  </g>

  <!-- Content Stack (Middle to Right) -->
  <g transform="translate(490, 20)">
    <!-- Small Category Pill / Tagline -->
    <text x="0" y="20" text-anchor="middle" class="topic-tag">SECTION 12 • PRE-SUBMISSION</text>

    <!-- Prominent Big Bold Title -->
    <text x="0" y="54" text-anchor="middle" class="topic-title">Edge Cases Checklist</text>

    <!-- Crystal Clear Subtitle -->
    <text x="0" y="80" text-anchor="middle" class="topic-sub">9-Point Pre-Submission Safety Audit Checklist</text>
  </g>

  <!-- Right Decorative Nodes -->
  <g transform="translate(885, 62)">
    <circle cx="0" cy="0" r="16" fill="url(#redBadgeBg_header_12)" stroke="url(#redBorder_header_12)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" />
  </g>
</svg>
