<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="370" fill="none">
  <defs>
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="roadCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Connectors -->
    <linearGradient id="flow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="flow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="flow3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <filter id="roadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .road-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .tier-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 1px; }
    .node-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
    .node-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 11px; fill: #94a3b8; }
  </style>

  <!-- Container Base -->
  <rect x="2" y="2" width="1196" height="366" rx="18" fill="url(#roadBg)" stroke="#334155" stroke-width="2" />

  <!-- Top Banner -->
  <text x="600" y="36" text-anchor="middle" class="road-title" font-size="20" letter-spacing="1">🗺️ DSA PATTERN MASTERY ROADMAP</text>

  <!-- ==================== TIER 1 ==================== -->
  <g transform="translate(30, 55)">
    <!-- Tier Badge -->
    <rect x="0" y="8" width="100" height="24" rx="12" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2" />
    <text x="50" y="24" text-anchor="middle" fill="#38bdf8" class="tier-label">TIER 1</text>
    
    <!-- Nodes -->
    <g transform="translate(120, 0)">
      <rect width="220" height="42" rx="10" fill="url(#roadCard)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="110" y="26" text-anchor="middle" class="node-text">1. Arrays &amp; Strings</text>
    </g>
    <path d="M 340 21 L 370 21" stroke="url(#flow1)" stroke-width="3" />
    <polygon points="370,17 378,21 370,25" fill="#38bdf8" />

    <g transform="translate(380, 0)">
      <rect width="220" height="42" rx="10" fill="url(#roadCard)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="110" y="26" text-anchor="middle" class="node-text">2. HashMap &amp; HashSet</text>
    </g>
    <path d="M 600 21 L 630 21" stroke="url(#flow1)" stroke-width="3" />
    <polygon points="630,17 638,21 630,25" fill="#38bdf8" />

    <g transform="translate(640, 0)">
      <rect width="220" height="42" rx="10" fill="url(#roadCard)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="110" y="26" text-anchor="middle" class="node-text">3. Two Pointers</text>
    </g>
    <path d="M 860 21 L 890 21" stroke="url(#flow1)" stroke-width="3" />
    <polygon points="890,17 898,21 890,25" fill="#38bdf8" />

    <g transform="translate(900, 0)">
      <rect width="220" height="42" rx="10" fill="url(#roadCard)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="110" y="26" text-anchor="middle" class="node-text">4. Sliding Window</text>
    </g>
  </g>

  <!-- Connecting Snake Curve Tier 1 -> Tier 2 -->
  <path d="M 1010 97 L 1010 120 L 230 120 L 230 133" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="5 5" />
  <polygon points="226,133 230,140 234,133" fill="#818cf8" />

  <!-- ==================== TIER 2 ==================== -->
  <g transform="translate(30, 130)">
    <!-- Tier Badge -->
    <rect x="0" y="8" width="100" height="24" rx="12" fill="#818cf8" fill-opacity="0.18" stroke="#818cf8" stroke-width="1.2" />
    <text x="50" y="24" text-anchor="middle" fill="#818cf8" class="tier-label">TIER 2</text>

    <!-- Nodes -->
    <g transform="translate(120, 0)">
      <rect width="220" height="42" rx="10" fill="url(#roadCard)" stroke="#818cf8" stroke-width="1.5" />
      <text x="110" y="26" text-anchor="middle" class="node-text">5. Prefix Sum</text>
    </g>
    <path d="M 340 21 L 370 21" stroke="url(#flow2)" stroke-width="3" />
    <polygon points="370,17 378,21 370,25" fill="#818cf8" />

    <g transform="translate(380, 0)">
      <rect width="220" height="42" rx="10" fill="url(#roadCard)" stroke="#818cf8" stroke-width="1.5" />
      <text x="110" y="26" text-anchor="middle" class="node-text">6. Binary Search</text>
    </g>
    <path d="M 600 21 L 630 21" stroke="url(#flow2)" stroke-width="3" />
    <polygon points="630,17 638,21 630,25" fill="#818cf8" />

    <g transform="translate(640, 0)">
      <rect width="220" height="42" rx="10" fill="url(#roadCard)" stroke="#818cf8" stroke-width="1.5" />
      <text x="110" y="26" text-anchor="middle" class="node-text">7. Monotonic Stack</text>
    </g>
    <path d="M 860 21 L 890 21" stroke="url(#flow2)" stroke-width="3" />
    <polygon points="890,17 898,21 890,25" fill="#818cf8" />

    <g transform="translate(900, 0)">
      <rect width="220" height="42" rx="10" fill="url(#roadCard)" stroke="#818cf8" stroke-width="1.5" />
      <text x="110" y="26" text-anchor="middle" class="node-text">8. Linked Lists</text>
    </g>
  </g>

  <!-- Connecting Snake Curve Tier 2 -> Tier 3 -->
  <path d="M 1010 172 L 1010 195 L 230 195 L 230 208" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="5 5" />
  <polygon points="226,208 230,215 234,208" fill="#c084fc" />

  <!-- ==================== TIER 3 ==================== -->
  <g transform="translate(30, 205)">
    <!-- Tier Badge -->
    <rect x="0" y="8" width="100" height="24" rx="12" fill="#c084fc" fill-opacity="0.18" stroke="#c084fc" stroke-width="1.2" />
    <text x="50" y="24" text-anchor="middle" fill="#c084fc" class="tier-label">TIER 3</text>

    <!-- Nodes -->
    <g transform="translate(120, 0)">
      <rect width="295" height="42" rx="10" fill="url(#roadCard)" stroke="#c084fc" stroke-width="1.5" />
      <text x="147" y="26" text-anchor="middle" class="node-text">9. Recursion &amp; Backtracking</text>
    </g>
    <path d="M 415 21 L 465 21" stroke="url(#flow2)" stroke-width="3" />
    <polygon points="465,17 473,21 465,25" fill="#c084fc" />

    <g transform="translate(475, 0)">
      <rect width="295" height="42" rx="10" fill="url(#roadCard)" stroke="#c084fc" stroke-width="1.5" />
      <text x="147" y="26" text-anchor="middle" class="node-text">10. Trees &amp; BST Traversal</text>
    </g>
    <path d="M 770 21 L 820 21" stroke="url(#flow2)" stroke-width="3" />
    <polygon points="820,17 828,21 820,25" fill="#c084fc" />

    <g transform="translate(830, 0)">
      <rect width="290" height="42" rx="10" fill="url(#roadCard)" stroke="#c084fc" stroke-width="1.5" />
      <text x="145" y="26" text-anchor="middle" class="node-text">11. Graphs (BFS / DFS / Topo)</text>
    </g>
  </g>

  <!-- Connecting Snake Curve Tier 3 -> Tier 4 -->
  <path d="M 975 247 L 975 270 L 230 270 L 230 283" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5 5" />
  <polygon points="226,283 230,290 234,283" fill="#f43f5e" />

  <!-- ==================== TIER 4 ==================== -->
  <g transform="translate(30, 280)">
    <!-- Tier Badge -->
    <rect x="0" y="8" width="100" height="24" rx="12" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-width="1.2" />
    <text x="50" y="24" text-anchor="middle" fill="#f43f5e" class="tier-label">TIER 4</text>

    <!-- Nodes -->
    <g transform="translate(120, 0)">
      <rect width="295" height="42" rx="10" fill="url(#roadCard)" stroke="#f43f5e" stroke-width="1.5" />
      <text x="147" y="26" text-anchor="middle" class="node-text">12. Heap / PriorityQueue</text>
    </g>
    <path d="M 415 21 L 465 21" stroke="url(#flow3)" stroke-width="3" />
    <polygon points="465,17 473,21 465,25" fill="#f43f5e" />

    <g transform="translate(475, 0)">
      <rect width="295" height="42" rx="10" fill="url(#roadCard)" stroke="#f43f5e" stroke-width="1.5" />
      <text x="147" y="26" text-anchor="middle" class="node-text">13. Greedy Algorithms</text>
    </g>
    <path d="M 770 21 L 820 21" stroke="url(#flow3)" stroke-width="3" />
    <polygon points="820,17 828,21 820,25" fill="#f43f5e" />

    <g transform="translate(830, 0)">
      <rect width="290" height="42" rx="10" fill="url(#roadCard)" stroke="#ec4899" stroke-width="2" filter="url(#roadGlow)" />
      <text x="145" y="26" text-anchor="middle" fill="#f472b6" class="node-text">14. Dynamic Programming (DP) 🏆</text>
    </g>
  </g>
</svg>
