<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="100%" height="56" fill="none">
  <defs>
    <linearGradient id="accentGradBold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="5%" stop-color="#00f2fe" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#3b82f6" stop-opacity="1" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="1" />
      <stop offset="75%" stop-color="#ec4899" stop-opacity="1" />
      <stop offset="95%" stop-color="#f43f5e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="capsuleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <filter id="accentGlowBold" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Layer 1: Edge-to-Edge Ambient Glow Track -->
  <line x1="0" y1="28" x2="1200" y2="28" stroke="url(#accentGradBold)" stroke-width="10" stroke-linecap="round" opacity="0.45" filter="url(#accentGlowBold)" />

  <!-- Layer 2: Core Vibrant Dashed Track -->
  <line x1="0" y1="28" x2="1200" y2="28" stroke="url(#accentGradBold)" stroke-width="5" stroke-linecap="round" stroke-dasharray="16 12" opacity="0.95" />

  <!-- Center Decorative Capsule Triad -->
  <rect x="526" y="21" width="30" height="14" rx="7" fill="#00f2fe" filter="url(#accentGlowBold)" />
  <rect x="566" y="17" width="68" height="22" rx="11" fill="url(#capsuleGrad)" filter="url(#accentGlowBold)" />
  <rect x="574" y="22" width="52" height="12" rx="6" fill="#ffffff" opacity="0.85" />
  <rect x="644" y="21" width="30" height="14" rx="7" fill="#f43f5e" filter="url(#accentGlowBold)" />
</svg>
