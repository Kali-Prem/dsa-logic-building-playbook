<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="100%" height="64" fill="none">
  <defs>
    <!-- 100% Full Width Radiant Spectrum Gradient -->
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="4%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="18%" stop-color="#3b82f6" stop-opacity="1" />
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="1" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="1" />
      <stop offset="65%" stop-color="#f43f5e" stop-opacity="1" />
      <stop offset="82%" stop-color="#fb923c" stop-opacity="1" />
      <stop offset="96%" stop-color="#facc15" stop-opacity="1" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.2" />
    </linearGradient>

    <!-- Center Crest Gradient -->
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="innerCrestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Strong Ambient Neon Glow -->
    <filter id="bigGlow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="3.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="crestGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Layer 1: Edge-to-Edge Ambient Soft Aura -->
  <line x1="0" y1="32" x2="1200" y2="32" stroke="url(#spectrumGrad)" stroke-width="14" stroke-linecap="round" opacity="0.4" filter="url(#bigGlow)" />

  <!-- Layer 2: Edge-to-Edge Luminous Middle Glow -->
  <line x1="0" y1="32" x2="1200" y2="32" stroke="url(#spectrumGrad)" stroke-width="7" stroke-linecap="round" opacity="0.9" filter="url(#bigGlow)" />

  <!-- Layer 3: Solid Vivid Core Centerline -->
  <line x1="0" y1="32" x2="1200" y2="32" stroke="url(#spectrumGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Center Decorative Accents -->
  <circle cx="500" cy="32" r="4" fill="#38bdf8" opacity="0.9" />
  <circle cx="528" cy="32" r="5.5" fill="#818cf8" filter="url(#crestGlow)" />
  <circle cx="558" cy="32" r="7" fill="#c084fc" filter="url(#crestGlow)" />

  <!-- Central Large Radiant Diamond Crest -->
  <g transform="translate(600, 32)">
    <!-- Outer Diamond Shadow & Glow -->
    <rect x="-18" y="-18" width="36" height="36" rx="7" transform="rotate(45)" fill="url(#crestGrad)" filter="url(#crestGlow)" />
    <!-- Inner Radiant Core Diamond -->
    <rect x="-10" y="-10" width="20" height="20" rx="4" transform="rotate(45)" fill="url(#innerCrestGrad)" />
    <!-- Center Spark Dot -->
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- Right Flanking Beads -->
  <circle cx="642" cy="32" r="7" fill="#f472b6" filter="url(#crestGlow)" />
  <circle cx="672" cy="32" r="5.5" fill="#fb7185" filter="url(#crestGlow)" />
  <circle cx="700" cy="32" r="4" fill="#f59e0b" opacity="0.9" />
</svg>
