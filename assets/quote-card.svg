<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="120" fill="none">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- LIVE Accent Gradient -->
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#f472b6;#06b6d4;#38bdf8" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#f472b6;#06b6d4;#38bdf8;#818cf8" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#06b6d4;#38bdf8;#818cf8;#c084fc" dur="5s" repeatCount="indefinite" />
      </stop>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Shimmer Specular Sweep -->
    <linearGradient id="qShimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;200%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;300%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="qBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.08" />
    </linearGradient>

    <!-- Glow Filter with Breathing Pulse -->
    <filter id="qGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur">
        <animate attributeName="stdDeviation" values="4;8;4" dur="2.5s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .q-tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 1.5px; fill: #38bdf8; }
    .q-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #ffffff; letter-spacing: -0.3px; }
    .q-desc { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 13.5px; fill: #cbd5e1; }
    .q-pill-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #38bdf8; letter-spacing: 0.3px; }
    .watermark { font-family: Georgia, serif; font-weight: 700; font-size: 130px; fill: #38bdf8; opacity: 0.05; }
  </style>

  <!-- Container Base -->
  <rect x="2" y="2" width="916" height="116" rx="16" fill="url(#qBg)" stroke="#1e293b" stroke-width="1.8" />

  <!-- Left Accent Glow Bar -->
  <rect x="2" y="14" width="6" height="92" rx="3" fill="url(#qGrad)" filter="url(#qGlow)" />

  <!-- Background Decorative Watermark Quote -->
  <text x="50" y="95" class="watermark">&#8220;</text>
  <text x="830" y="95" class="watermark">&#8221;</text>

  <!-- Left Icon Badge -->
  <g transform="translate(24, 22)">
    <rect width="74" height="74" rx="16" fill="url(#qBadgeBg)" stroke="url(#qGrad)" stroke-width="1.5" />
    <text x="37" y="46" text-anchor="middle" font-size="32">🧠</text>
  </g>

  <!-- Main Content Stack -->
  <g transform="translate(116, 20)">
    <!-- Category Tag -->
    <text x="0" y="16" class="q-tag">CORE PHILOSOPHY &#8226; THE DSA PLAYBOOK</text>

    <!-- Main Quote Heading -->
    <text x="0" y="43" class="q-title">&#8220;DSA ki problem me logic kaise sochein?&#8221;</text>
    <text x="0" y="43" class="q-title" fill="url(#qShimmer)">&#8220;DSA ki problem me logic kaise sochein?&#8221;</text>

    <!-- Flow Description -->
    <text x="0" y="67" class="q-desc">Test case dekh ke pattern nikalna &#8594; Brute force se optimal tak jana &#8594; Clean Java me likhna</text>

    <!-- Bottom Takeaway Pill -->
    <g transform="translate(0, 77)">
      <rect width="390" height="20" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="12" y="14" class="q-pill-text">&#10024; Ek baar padho, har problem pe yahi steps lagao</text>
    </g>
  </g>
</svg>