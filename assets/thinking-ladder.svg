<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="450" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="accent6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accent7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Connector Pulse Gradient -->
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .sub-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
    .step-pill { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.5px; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 17px; fill: #f8fafc; }
    .card-body { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 13px; fill: #cbd5e1; }
    .card-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
  </style>

  <!-- Outer Canvas Container -->
  <rect x="2" y="2" width="1196" height="446" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Top Title Banner -->
  <text x="600" y="40" text-anchor="middle" class="title-text" font-size="22" letter-spacing="1">🪜 THE 8-STEP THINKING LADDER</text>
  <text x="600" y="60" text-anchor="middle" class="sub-text" font-size="13">Problem Understanding ──► Brute Force ──► Waste Elimination ──► Optimal Code</text>

  <!-- ==================== ROW 1 (STEPS 1 - 4) ==================== -->
  
  <!-- Connecting Wire Row 1 -->
  <line x1="160" y1="160" x2="1040" y2="160" stroke="#334155" stroke-width="4" stroke-dasharray="6 6" />

  <!-- STEP 1 CARD -->
  <g transform="translate(35, 80)">
    <rect width="265" height="150" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2" />
    <rect x="15" y="14" width="70" height="22" rx="11" fill="#38bdf8" fill-opacity="0.2" />
    <text x="50" y="29" text-anchor="middle" fill="#38bdf8" class="step-pill">STEP 01</text>
    <text x="15" y="62" class="card-title">👁️ 1. Observe</text>
    <text x="15" y="88" class="card-body">Input se Output kaise bana?</text>
    <text x="15" y="108" class="card-sub">• Kya badla, kya same raha?</text>
    <text x="15" y="126" class="card-sub">• Sample test case haath se trace</text>
  </g>

  <!-- STEP 2 CARD -->
  <g transform="translate(325, 80)">
    <rect width="265" height="150" rx="14" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="2" />
    <rect x="15" y="14" width="70" height="22" rx="11" fill="#818cf8" fill-opacity="0.2" />
    <text x="50" y="29" text-anchor="middle" fill="#818cf8" class="step-pill">STEP 02</text>
    <text x="15" y="62" class="card-title">✍️ 2. Manual Solve</text>
    <text x="15" y="88" class="card-body">Kagaz pe insaan ki tarah solve</text>
    <text x="15" y="108" class="card-sub">• Code bhool jao, pen uthao</text>
    <text x="15" y="126" class="card-sub">• 3-4 steps me result tak pahuncho</text>
  </g>

  <!-- STEP 3 CARD -->
  <g transform="translate(615, 80)">
    <rect width="265" height="150" rx="14" fill="url(#cardGrad1)" stroke="#c084fc" stroke-width="2" />
    <rect x="15" y="14" width="70" height="22" rx="11" fill="#c084fc" fill-opacity="0.2" />
    <text x="50" y="29" text-anchor="middle" fill="#c084fc" class="step-pill">STEP 03</text>
    <text x="15" y="62" class="card-title">🏷️ 3. Naam Do</text>
    <text x="15" y="88" class="card-body">Kaunsa kaam repeat hua?</text>
    <text x="15" y="108" class="card-sub">• Repeat step = Tumhara Loop</text>
    <text x="15" y="126" class="card-sub">• Yaad rakhi state = Variable / DS</text>
  </g>

  <!-- STEP 4 CARD -->
  <g transform="translate(905, 80)">
    <rect width="265" height="150" rx="14" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="2" />
    <rect x="15" y="14" width="70" height="22" rx="11" fill="#f59e0b" fill-opacity="0.2" />
    <text x="50" y="29" text-anchor="middle" fill="#f59e0b" class="step-pill">STEP 04</text>
    <text x="15" y="62" class="card-title">🔨 4. Brute Force</text>
    <text x="15" y="88" class="card-body">Sabse seedha tareeka likho</text>
    <text x="15" y="108" class="card-sub">• Safety net ready ho gaya</text>
    <text x="15" y="126" class="card-sub">• Time &amp; Space complexity nikalo</text>
  </g>

  <!-- Transition Bridge between Step 4 and Step 5 -->
  <path d="M 1037 230 L 1037 252 L 160 252 L 160 268" stroke="url(#wireGrad)" stroke-width="3" fill="none" stroke-dasharray="4 4" />
  <circle cx="160" cy="270" r="4" fill="#ef4444" />

  <!-- ==================== ROW 2 (STEPS 5 - 8) ==================== -->

  <!-- STEP 5 CARD -->
  <g transform="translate(35, 275)">
    <rect width="265" height="150" rx="14" fill="url(#cardGrad1)" stroke="#ef4444" stroke-width="2" />
    <rect x="15" y="14" width="70" height="22" rx="11" fill="#ef4444" fill-opacity="0.2" />
    <text x="50" y="29" text-anchor="middle" fill="#ef4444" class="step-pill">STEP 05</text>
    <text x="15" y="62" class="card-title">🔍 5. Waste Dhoondo</text>
    <text x="15" y="88" class="card-body">Bottleneck dhoondna</text>
    <text x="15" y="108" class="card-sub">• Baar-baar search ya sort?</text>
    <text x="15" y="126" class="card-sub">• Subproblem recalculation?</text>
  </g>

  <!-- STEP 6 CARD -->
  <g transform="translate(325, 275)">
    <rect width="265" height="150" rx="14" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="14" width="70" height="22" rx="11" fill="#10b981" fill-opacity="0.2" />
    <text x="50" y="29" text-anchor="middle" fill="#10b981" class="step-pill">STEP 06</text>
    <text x="15" y="62" class="card-title">🧰 6. Tool Chuno</text>
    <text x="15" y="88" class="card-body">Waste ka exact ilaaj match karo</text>
    <text x="15" y="108" class="card-sub">• Search = HashMap, Range = Prefix</text>
    <text x="15" y="126" class="card-sub">• Subproblems = DP, Extreme = Heap</text>
  </g>

  <!-- STEP 7 CARD -->
  <g transform="translate(615, 275)">
    <rect width="265" height="150" rx="14" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-width="2" />
    <rect x="15" y="14" width="70" height="22" rx="11" fill="#06b6d4" fill-opacity="0.2" />
    <text x="50" y="29" text-anchor="middle" fill="#06b6d4" class="step-pill">STEP 07</text>
    <text x="15" y="62" class="card-title">🧪 7. Dry Run</text>
    <text x="15" y="88" class="card-body">Trace table bana ke verify karo</text>
    <text x="15" y="108" class="card-sub">• 3-4 elements pe variable tracking</text>
    <text x="15" y="126" class="card-sub">• Edge cases (empty, negative, 0)</text>
  </g>

  <!-- STEP 8 CARD -->
  <g transform="translate(905, 275)">
    <rect width="265" height="150" rx="14" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="2.5" />
    <rect x="15" y="14" width="70" height="22" rx="11" fill="#ec4899" fill-opacity="0.2" />
    <text x="50" y="29" text-anchor="middle" fill="#ec4899" class="step-pill">STEP 08</text>
    <text x="15" y="62" class="card-title">💻 8. Optimal Code</text>
    <text x="15" y="88" class="card-body">Clean production Java code</text>
    <text x="15" y="108" class="card-sub">• Dry run ko line-by-line translate</text>
    <text x="15" y="126" class="card-sub">• AC (Accepted) without TLE! 🎯</text>
  </g>

</svg>
